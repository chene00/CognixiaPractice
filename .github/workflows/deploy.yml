name: CI/CD Serverless Pipeline (With Automated Testing)

on:
  push:
    branches: [ main ]

jobs:
  # --------------------------------------------------------------------------
  # STAGE 1: Continuous Integration (Automated Test Suite Execution)
  # --------------------------------------------------------------------------
  run-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all your backend frameworks and testing utilities
          pip install -r backend/requirements.txt

      - name: Run Test Suite via Pytest
        env:
          # Injects dummy variables so your pydantic-settings config compiles cleanly during tests
          MONGODB_URL: "mongodb://localhost:27017"
          DATABASE_NAME: "TestBankApp"
          SECRET_KEY: "test_secret_key_placeholder_for_pipeline_ci"
        run: |
          # Set python path context so pytest knows how to look into the backend folder module
          PYTHONPATH=. pytest

  # --------------------------------------------------------------------------
  # STAGE 2: Frontend Asset Deployment (Only triggers if tests pass!)
  # --------------------------------------------------------------------------
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [run-tests] # Guard clause: halts completely if tests fail
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Build Frontend
        working-directory: frontend # <--- ADDED: Tells runner to enter frontend folder
        env:
          VITE_API_BASE_URL: ${{ vars.LIVE_API_URL }}
        run: |
          npm install
          npm run build 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Static Assets to S3
        working-directory: frontend # <--- ADDED: Ensures it targets frontend/dist/
        run: |
          aws s3 sync dist/ s3://student-eric-chen-s3-frontend-bankapp --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  # --------------------------------------------------------------------------
  # STAGE 3: Backend Serverless Bundle Deployment (Only triggers if tests pass!)
  # --------------------------------------------------------------------------
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [run-tests] # Guard clause: halts completely if tests fail
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Production Build Package
        run: |
          mkdir deployment_package
          
          # Pull pre-compiled Linux binary wheels for native Lambda Python execution
          pip install \
            --platform manylinux2014_x86_64 \
            --target deployment_package \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -r backend/requirements.txt
            
          cp -r backend/* deployment_package/
          
          cd deployment_package
          zip -r ../backend_deployment.zip .
          cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload Zip Code Bundle Directly to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name student-eric-chen-lambda-backend-bankapp \
            --zip-file fileb://backend_deployment.zip